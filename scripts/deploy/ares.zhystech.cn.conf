# Ares — https://ares.zhystech.cn → host:18888
# 放到: /opt/dify1113/docker/nginx/conf.d/ares.zhystech.cn.conf

upstream ares_backend {
    # Dify nginx 需先: docker network connect tradingagents_tradingagents-network docker-nginx-1
    server tradingagents-nginx:80;
    keepalive 8;
}

server {
    listen 80;
    server_name ares.zhystech.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ares.zhystech.cn;

    ssl_certificate     /etc/letsencrypt/live/ares.zhystech.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ares.zhystech.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 100M;

    location / {
        proxy_pass http://ares_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
