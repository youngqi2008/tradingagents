# 先只配 HTTP + ACME（证书尚未签发前用这个文件）
# 放到: /opt/dify1113/docker/nginx/conf.d/ares.zhystech.cn.conf
#
# 申请成功后，再换成 scripts/deploy/ares.zhystech.cn.conf（含 443）

server {
    listen 80;
    server_name ares.zhystech.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 200 'ares http ok, awaiting cert';
        add_header Content-Type text/plain;
    }
}
