# Ares @ 47.95.5.18 生产拓扑
#
# - MongoDB：compose 全新部署（tradingagents 专用）
# - Redis：复用宿主机/Dify（不启动 redis 容器）
# - MySQL：宿主机 13306（与现有 ares_ops 相同）
#
# 用法:
#   export COMPOSE_FILE=docker-compose.hub.nginx.47.yml
#   ./scripts/deploy/deploy_prod.sh all
#
# 首次部署前若需彻底清空旧 Mongo 数据卷:
#   docker compose -f docker-compose.hub.nginx.47.yml down -v   # 慎用，会删卷
#
# 国内 ECS 若拉取 mongo 失败，先执行:
#   ./scripts/deploy/pull_base_images.sh

services:
  mongodb:
    # 默认 mongo:4.4；拉取失败时在 .env 设 MONGO_IMAGE=docker.m.daocloud.io/library/mongo:4.4
    image: ${MONGO_IMAGE:-mongo:4.4}
    pull_policy: if_not_present
    container_name: tradingagents-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - tradingagents_mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: tradingagents123
      MONGO_INITDB_DATABASE: tradingagents
      TZ: "Asia/Shanghai"
    networks:
      - tradingagents-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: hsliup/tradingagents-backend:latest
    pull_policy: build
    container_name: tradingagents-backend
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./uploads:/app/uploads
    env_file:
      - .env
    environment:
      TZ: "Asia/Shanghai"
      TRADINGAGENTS_LOG_LEVEL: "INFO"
      TRADINGAGENTS_LOG_DIR: "/app/logs"
      TRADINGAGENTS_LOG_FILE: "/app/logs/tradingagents.log"
      # MongoDB：同 compose 网络内服务名 mongodb
      MONGODB_HOST: "mongodb"
      MONGODB_PORT: "27017"
      MONGODB_USERNAME: "${MONGODB_USERNAME:-admin}"
      MONGODB_PASSWORD: "${MONGODB_PASSWORD:-tradingagents123}"
      MONGODB_DATABASE: "${MONGODB_DATABASE:-tradingagents}"
      MONGODB_AUTH_SOURCE: "${MONGODB_AUTH_SOURCE:-admin}"
      MONGODB_URL: "mongodb://${MONGODB_USERNAME:-admin}:${MONGODB_PASSWORD:-tradingagents123}@mongodb:27017/${MONGODB_DATABASE:-tradingagents}?authSource=${MONGODB_AUTH_SOURCE:-admin}"
      MONGODB_CONNECTION_STRING: "mongodb://${MONGODB_USERNAME:-admin}:${MONGODB_PASSWORD:-tradingagents123}@mongodb:27017/${MONGODB_DATABASE:-tradingagents}?authSource=${MONGODB_AUTH_SOURCE:-admin}"
      MONGODB_ENABLED: "true"
      # Redis：宿主机/Dify（见 .env REDIS_*）
      REDIS_HOST: "${REDIS_HOST:-host.docker.internal}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_DB: "${REDIS_DB:-1}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@${REDIS_HOST:-host.docker.internal}:${REDIS_PORT:-6379}/${REDIS_DB:-1}"
      REDIS_ENABLED: "true"
      # MySQL：宿主机 13306
      MYSQL_HOST: "${MYSQL_HOST:-host.docker.internal}"
      MYSQL_PORT: "${MYSQL_PORT:-13306}"
      MYSQL_USER: "${MYSQL_USER:-root}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-ares_ops}"
      DOCKER_CONTAINER: "true"
      JWT_SECRET: "${JWT_SECRET:-docker-jwt-secret-key-change-in-production-2024}"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
      CSRF_SECRET: "${CSRF_SECRET:-docker-csrf-secret-key-change-in-production-2024}"
      BCRYPT_ROUNDS: "12"
      CORS_ORIGINS: "*"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY}"
      DASHSCOPE_ENABLED: "${DASHSCOPE_ENABLED:-false}"
      QWEN_API_KEY: "${DASHSCOPE_API_KEY}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      DEEPSEEK_ENABLED: "${DEEPSEEK_ENABLED:-false}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_ENABLED: "${OPENAI_ENABLED:-false}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY}"
      GOOGLE_ENABLED: "${GOOGLE_ENABLED:-false}"
      BAIDU_API_KEY: "${BAIDU_API_KEY:-}"
      BAIDU_SECRET_KEY: "${BAIDU_SECRET_KEY:-}"
      BAIDU_ENABLED: "${BAIDU_ENABLED:-false}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      OPENROUTER_ENABLED: "${OPENROUTER_ENABLED:-false}"
      TUSHARE_TOKEN: "${TUSHARE_TOKEN}"
      TUSHARE_ENABLED: "${TUSHARE_ENABLED:-false}"
      AKSHARE_ENABLED: "${AKSHARE_ENABLED:-true}"
      BAOSTOCK_ENABLED: "${BAOSTOCK_ENABLED:-true}"
      FINNHUB_API_KEY: "${FINNHUB_API_KEY}"
      FINNHUB_ENABLED: "${FINNHUB_ENABLED:-false}"
      WECHAT_MINI_APP_ID: "${WECHAT_MINI_APP_ID}"
      WECHAT_MINI_APP_SECRET: "${WECHAT_MINI_APP_SECRET}"
      WECHAT_ALLOW_DEV_LOGIN: "${WECHAT_ALLOW_DEV_LOGIN:-false}"
      WECHAT_PAY_MOCK: "${WECHAT_PAY_MOCK:-true}"
      WECHAT_PAY_ENABLED: "${WECHAT_PAY_ENABLED:-false}"
      WECHAT_MCH_ID: "${WECHAT_MCH_ID:-}"
      WECHAT_MCH_SERIAL_NO: "${WECHAT_MCH_SERIAL_NO:-}"
      WECHAT_API_V3_KEY: "${WECHAT_API_V3_KEY:-}"
      WECHAT_PAY_NOTIFY_URL: "${WECHAT_PAY_NOTIFY_URL:-}"
      WECHAT_PAY_PUBLIC_KEY_ID: "${WECHAT_PAY_PUBLIC_KEY_ID:-}"
      LITELLM_MODEL: "${LITELLM_MODEL:-dashscope/qwen-plus}"
      LITELLM_FALLBACK_MODELS: "${LITELLM_FALLBACK_MODELS:-deepseek/deepseek-chat}"
      DASHSCOPE_MODEL: "${DASHSCOPE_MODEL:-qwen-plus}"
      TAVILY_API_KEYS: "${TAVILY_API_KEYS:-}"
      BRAVE_API_KEYS: "${BRAVE_API_KEYS:-}"
      SEARXNG_PUBLIC_INSTANCES_ENABLED: "${SEARXNG_PUBLIC_INSTANCES_ENABLED:-true}"
      AGENT_MODE: "${AGENT_MODE:-true}"
      AGENT_MAX_STEPS: "${AGENT_MAX_STEPS:-10}"
      ENABLE_REALTIME_QUOTE: "${ENABLE_REALTIME_QUOTE:-true}"
      ENABLE_CHIP_DISTRIBUTION: "${ENABLE_CHIP_DISTRIBUTION:-true}"
      ARES_SIGNAL_TOKEN: "${ARES_SIGNAL_TOKEN:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - tradingagents-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: hsliup/tradingagents-frontend:latest
    pull_policy: build
    container_name: tradingagents-frontend
    restart: unless-stopped
    expose:
      - "80"
    environment:
      TZ: "Asia/Shanghai"
      VITE_API_BASE_URL: "/api"
    depends_on:
      - backend
    networks:
      - tradingagents-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: tradingagents-nginx:latest
    pull_policy: build
    container_name: tradingagents-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - tradingagents-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  tradingagents_mongodb_data:
    driver: local

networks:
  tradingagents-network:
    driver: bridge
